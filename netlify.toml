[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/route"
  to = "/.netlify/functions/route"
  status = 200

[[redirects]]
  from = "/api/properties"
  to = "/.netlify/functions/properties"
  status = 200

[[redirects]]
  from = "/api/pois"
  to = "/.netlify/functions/pois"
  status = 200

[[redirects]]
  from = "/api/locations-search"
  to = "/.netlify/functions/locations-search"
  status = 200

[[redirects]]
  from = "/api/save-report"
  to = "/.netlify/functions/save-report"
  status = 200

[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/waitlist"
  status = 200

[[redirects]]
  from = "/api/hpi"
  to = "/.netlify/functions/hpi"
  status = 200

  # --- Coming-soon mode ---
# Every non-API request gets the coming-soon page.
# Comment out this block when you're ready to relaunch.
[[redirects]]
  from = "/*"
  to = "/coming-soon.html"
  status = 200
  force = true
